<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Importação do CSS do Bootstrap via CDN na Tag Head -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Minha loja</title>
</head>
<body>
    <h1>Olá, Mundo!</h1>

    <!-- Ocupa toda a tela, ideal para Cabeçalhos e Menus -->
    <nav class="container-fluid bg-dark text-white p-3">
        Menu 100% da tela
    </nav>

    <!-- Centralizado com margens laterais nas telas grandes, ideal para o miolo do site -->
    <main class="container bg-light p-5 mt-4 border">
        Conteúdo principal centralizado e focado
    </main>

    <div class="container mt-5">
        <!-- Centralizado, Azul, Negrito e com Margem em baixo (mb-4) -->
        <h1 class="text-center text-primary fw-bold mb-4">
            Catálogo de Produtos
        </h1>

        <!-- Texto Cinza, Centralizado e com Fonte tamanho 5 -->
        <p class="text-muted text-center fs-5">
            Aproveite as ofertas do dia!
        </p>
    </div>
</body>
</html>
